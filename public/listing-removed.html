<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Listing Removed | Seller's Filter</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f7f7f7;
      color: #333;
    }

    .container {
      max-width: 520px;
      margin: 40px auto;
      background: white;
      padding: 32px 24px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 22px;
      margin-bottom: 16px;
      color: #1b5e20;
    }

    p {
      margin: 0 0 12px;
      font-size: 16px;
      line-height: 1.5;
    }

    .actions {
      margin-top: 28px;
    }

    .btn-primary {
      display: inline-block;
      padding: 12px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: #2d4f73;
      color: white;
      text-decoration: none;
      cursor: pointer;
    }

    .btn-primary:hover {
      background-color: #1f3a55;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px;
        padding: 28px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Your listing has been removed.</h1>
    <p>Thanks for using Seller's Filter, and congratulations on your sale!</p>
    <div class="actions">
      <a href="/create.html" class="btn-primary">Create Another Listing &rarr;</a>
    </div>
  </div>
</body>
</html>
